permissions: { contents: read }
jobs:
  validate-only:
    if: inputs.confirmation == 'VALIDATE'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No build publication, deployment, release, or cloud mutation is configured in Phase Zero."
