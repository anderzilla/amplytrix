name: amplytrix-local
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: amplytrix
      POSTGRES_USER: amplytrix
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amplytrix -d amplytrix']
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ['no-new-privileges:true']
volumes:
  postgres-data:
